[workspace]
resolver = "2"
members = ["crates/vertice-core", "crates/vertice-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vertice/vertice"

[workspace.dependencies]
vertice-core = { path = "crates/vertice-core" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "deny"
