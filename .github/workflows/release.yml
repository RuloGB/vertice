name: Release

on:
  # A version tag is the only thing that produces a GitHub Release. The tag is
  # expected to point at a commit already on `main`, i.e. one the full
  # three-platform CI matrix has validated (see ci.yml, "push to main"). This
  # workflow deliberately does NOT re-run the quality gates: it packages an
  # already-validated commit, it does not certify one.
  push:
    tags:
      - "v*"
  # Manual escape hatch: build the installers from any branch WITHOUT creating
  # a release, so a packaging change can be smoke-tested before a tag exists.
  # The bundles land as workflow artifacts (see `uploadWorkflowArtifacts`).
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  # Never cancel: a half-uploaded release is worse than a duplicated run.
  cancel-in-progress: false

# Least privilege, per scope:
#   contents      -- create the draft release and upload the installers to it.
#   id-token      -- OIDC token that signs the provenance statement (Sigstore).
#   attestations  -- write the provenance attestation to this repository.
# The last two are what `actions/attest-build-provenance` needs. Provenance is
# free and needs no certificate, so it ships from the first release even though
# code signing does not (see README, "Why Windows warns about this installer").
permissions:
  contents: write
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: windows installer (unsigned)
    # Pinned to the same runner image as ci.yml's Windows matrix leg, so the
    # installer is produced by the toolchain the tests ran on.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the app version
        # A tag that disagrees with `tauri.conf.json` would publish an
        # installer whose file name and in-app version contradict the release
        # it hangs under. Fail before spending ~20 minutes building it.
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          conf_version=$(grep -m1 '"version"' crates/vertice-app/tauri.conf.json | sed -E 's/.*: *"([^"]+)".*/\1/')
          tag_version="${GITHUB_REF_NAME#v}"

          echo "tauri.conf.json version: $conf_version"
          echo "git tag:                 $GITHUB_REF_NAME"

          if [ "$conf_version" != "$tag_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match tauri.conf.json version $conf_version"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        # `tauri build` runs the config's `beforeBuildCommand` (`npm run build`
        # in `frontend/`), which needs `frontend/node_modules` to already exist.
        run: npm ci
        working-directory: frontend

      - name: Read toolchain channel from rust-toolchain.toml
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel=$(grep -m1 '^channel' rust-toolchain.toml | cut -d '"' -f2)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain (pinned, matches rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}

      - uses: Swatinem/rust-cache@v2
        with:
          # Distinct key: this job builds `--release`, unlike ci.yml's mixed
          # debug/release cache, and sharing one would thrash both.
          key: release-windows

      - name: Build the Windows installers
        id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # This repository does not use Tauri's default `src-tauri/` layout:
          # `tauri.conf.json` lives in `crates/vertice-app/`. The action globs
          # for it under `projectPath`, so the workspace root is the correct
          # value -- and the CLI itself resolves the config the same way.
          projectPath: .
          # The `@tauri-apps/cli` version this project pins lives in
          # `frontend/package.json`, and there is no `package.json` at the
          # workspace root for the action to auto-detect. Naming the script
          # explicitly is what keeps CI on the pinned CLI instead of a globally
          # installed floating one. Identical to the documented local command
          # (`npx --prefix frontend tauri dev`).
          tauriScript: npx --prefix frontend tauri
          # Explicit rather than inherited from `bundle.targets: "all"`: the
          # deliverable is the NSIS `-setup.exe` plus the `.msi` for managed
          # deployments, and stating it here keeps a config change from
          # silently altering what a release contains.
          args: --bundles nsis,msi
          # Empty on `workflow_dispatch`: with no tag and no release id, the
          # action builds and stops, publishing nothing.
          tagName: ${{ github.event_name == 'push' && github.ref_name || '' }}
          releaseName: Vertice ${{ github.ref_name }}
          releaseBody: |
            Unsigned Windows installers, built and attested by GitHub Actions.

            Windows SmartScreen will warn on first run. That is expected for an
            unsigned installer -- see "Why Windows warns about this installer"
            in the README for what the warning means and how to verify the
            download before dismissing it.
          # Draft: a human reviews the assets and the notes, then publishes.
          # An unsigned first release should not go public unattended.
          releaseDraft: true
          prerelease: false
          # No updater is configured, so there is no `latest.json` to publish.
          uploadUpdaterJson: false
          # Also attach the bundles as workflow artifacts. This is what makes
          # the `workflow_dispatch` path useful: installers to test without
          # creating a tag or a release.
          uploadWorkflowArtifacts: true

      - name: Attest build provenance
        # Records, in a signed and publicly verifiable statement, which commit
        # and which workflow produced these exact bytes. It is not code signing
        # and will not stop the SmartScreen warning -- it is the part of the
        # guarantee that is available without a certificate. Verified by users
        # with `gh attestation verify <file> --repo <owner>/<repo>`.
        #
        # Literal globs rather than the action's `artifactPaths` output: these
        # are readable, and if the bundle layout ever moves, this step fails
        # loudly (no subject matched) instead of attesting nothing.
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
