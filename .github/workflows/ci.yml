name: CI

on:
  # NOTE: the two `paths-ignore` lists below are duplicated on purpose --
  # GitHub Actions does not support YAML anchors/aliases, so they must be kept
  # in sync by hand. Documentation-only trees are listed explicitly rather than
  # matched with a `**/*.md` glob: the core test fixtures under
  # `crates/vertice-core/tests/fixtures/` ARE Markdown files, and skipping CI
  # when those change would skip the very tests they pin.
  pull_request:
    branches: [main]
    paths-ignore:
      - "internal-docs/**"
      - "openspec/**"
      - "CLAUDE.md"
  push:
    branches: [main]
    paths-ignore:
      - "internal-docs/**"
      - "openspec/**"
      - "CLAUDE.md"
  # Manual escape hatch: runs the full cross-OS matrix on any branch, e.g. to
  # validate a Windows/macOS-sensitive change before it reaches main.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Pull requests cancel superseded runs: money saved, no guarantee lost.
  # Pushes to `main` and manual dispatches never cancel -- `main` is now the
  # sole carrier of the CA-17 three-platform guarantee, and a cancelled run
  # would silently leave a merge commit unvalidated on Windows and macOS.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Highest floor across the resolved dependency graph (empirically verified
  # locally with `RUSTUP_TOOLCHAIN=1.88 cargo check --workspace --locked
  # --all-targets`: 1.85 failed — several transitive deps of `tauri`
  # (`darling`, `icu_*`, `time`, `serde_with`) require rustc 1.88; 1.88
  # passed). Kept identical to `[workspace.package] rust-version` in
  # Cargo.toml — the `quality` job's "MSRV consistency" step fails the build
  # if these two drift. `rust-toolchain.toml` pins a newer exact patch
  # (1.97.1) for local/CI dev builds, which is expected (MSRV is a floor).
  MSRV: "1.88"

jobs:
  quality:
    name: quality (fmt, MSRV consistency, core purity)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Read toolchain channel from rust-toolchain.toml
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel=$(grep -m1 '^channel' rust-toolchain.toml | cut -d '"' -f2)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain (pinned, matches rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: rustfmt, clippy

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: MSRV consistency (Cargo.toml vs rust-toolchain.toml vs $MSRV)
        run: |
          set -euo pipefail
          manifest_rv=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/.*"([0-9.]+)".*/\1/')
          toolchain_channel=$(grep -m1 '^channel' rust-toolchain.toml | sed -E 's/.*"([0-9.]+)".*/\1/')

          echo "Cargo.toml rust-version:      $manifest_rv"
          echo "rust-toolchain.toml channel:  $toolchain_channel"
          echo "workflow MSRV env:            $MSRV"

          if [ "$manifest_rv" != "$MSRV" ]; then
            echo "::error::Cargo.toml rust-version ($manifest_rv) does not match workflow MSRV ($MSRV)"
            exit 1
          fi

          # The pinned dev/CI toolchain must never be BELOW the declared MSRV
          # floor (it may be newer; MSRV is a floor, not an exact pin).
          highest=$(printf '%s\n%s\n' "$manifest_rv" "$toolchain_channel" | sort -V | tail -n1)
          if [ "$highest" != "$toolchain_channel" ]; then
            echo "::error::rust-toolchain.toml channel ($toolchain_channel) is older than MSRV ($manifest_rv)"
            exit 1
          fi

      - name: Version consistency (Cargo.toml vs tauri.conf.json vs package.json)
        # The release workflow refuses to package a tag whose version does not
        # match `tauri.conf.json`. That gate fires only AFTER the tag is
        # already pushed and public, which is too late (observed on tag v0.1.3,
        # run 33483412746). These four files declare the same product version
        # and have drifted apart once already, so the disagreement is caught
        # here on every PR, before a tag exists to be regretted.
        run: |
          set -euo pipefail
          cargo_v=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          tauri_v=$(grep -m1 '"version"' crates/vertice-app/tauri.conf.json | sed -E 's/.*: *"([^"]+)".*/\1/')
          pkg_v=$(grep -m1 '"version"' frontend/package.json | sed -E 's/.*: *"([^"]+)".*/\1/')
          lock_v=$(grep -m1 '"version"' frontend/package-lock.json | sed -E 's/.*: *"([^"]+)".*/\1/')

          echo "Cargo.toml:                 $cargo_v"
          echo "tauri.conf.json:            $tauri_v"
          echo "frontend/package.json:      $pkg_v"
          echo "frontend/package-lock.json: $lock_v"

          for pair in "Cargo.toml:$cargo_v" "frontend/package.json:$pkg_v" "frontend/package-lock.json:$lock_v"; do
            name=${pair%%:*}
            value=${pair#*:}
            if [ "$value" != "$tauri_v" ]; then
              echo "::error::$name version ($value) does not match tauri.conf.json ($tauri_v)"
              exit 1
            fi
          done

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: cargo deny check bans licenses (core-purity + license allow-list)
        run: cargo deny check bans licenses

      - name: Regenerate TS bindings (ts-rs export tests)
        run: cargo test -p vertice-core --locked

      - name: Generated contract in sync
        # `git add --intent-to-add` first: plain `git diff` ignores untracked
        # files, so a NEW type whose generated binding was never committed
        # would slip through silently — the exact case this gate exists for.
        # Registering the regenerated files in the index makes them show up
        # as additions in the diff below.
        run: |
          git add --intent-to-add -- frontend/src/bindings
          git diff --exit-code -- frontend/src/bindings

  frontend:
    name: frontend (lint, check, test, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run test
      - run: npm run build

      - name: Upload frontend/dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  rust:
    name: rust (clippy, test, build)
    needs: frontend
    strategy:
      fail-fast: false
      matrix:
        # Windows bills at 2x and macOS at 10x the Linux minute rate, which
        # made a single pull request cost more in runner minutes than the
        # Linux jobs combined. Pull requests validate on Linux only; the full
        # matrix runs on push to `main` and on `workflow_dispatch`, so a
        # platform-specific regression is still caught before release — just
        # after merge rather than before it.
        # This `&&`/`||` idiom only yields a real array because both operands
        # are non-empty JSON arrays. A future "run nothing" variant MUST use a
        # job-level `if:` instead -- `fromJSON('[]')` is not reliably truthy.
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-24.04"]') || fromJSON('["ubuntu-24.04", "windows-2022", "macos-14"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux WebView dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            patchelf

      - name: Read toolchain channel from rust-toolchain.toml
        id: toolchain
        shell: bash
        run: |
          set -euo pipefail
          channel=$(grep -m1 '^channel' rust-toolchain.toml | cut -d '"' -f2)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain (pinned, matches rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Download frontend/dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test --workspace --locked
        run: cargo test --workspace --locked

      - name: cargo build --release -p vertice-app
        run: cargo build --release -p vertice-app

  msrv:
    name: msrv (1.88)
    needs: frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux WebView dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            librsvg2-dev \
            patchelf

      - name: Install MSRV Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.MSRV }}

      # This job had no cache and so rebuilt the entire `tauri` dependency
      # tree from scratch on every run (~37 min observed) — the longest job in
      # the workflow. A separate cache key keeps it from colliding with the
      # `rust` job, which uses a different toolchain.
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-${{ env.MSRV }}

      - name: Download frontend/dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: cargo check --workspace --locked --all-targets (MSRV)
        env:
          RUSTUP_TOOLCHAIN: ${{ env.MSRV }}
        run: cargo check --workspace --locked --all-targets
